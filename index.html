<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Clicker Game</title>
  <link rel="stylesheet" href="./style.css" >
  <script src="./script.js"> </script>
</head>
<body>

  <nav id="navbar">
    <a href="#navbar">🐶🐱PET CLICKER GAME🐍</a>
    </nav> <br><br><br>

 

  <p>Pick your pet:</p>
  <button onclick="choosePet('dog')">Dog</button>
  <button onclick="choosePet('cat')">Cat</button>
  <button onclick="choosePet('snake')">Snake</button>
  <button onclick="choosePet('rabbit')">Rabbit</button>

  <div id="game" style="display:none;">
    <img id="petImage" class="pet" src="" alt="Your Pet" onclick="playWithPet()">
    <div id="counter">Times played: 0</div>
    <div id="actions"></div>
  </div>

</body>
</html>
